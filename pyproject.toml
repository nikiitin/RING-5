[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ring5"
version = "1.0.0"
description = "Modern gem5 Data Analysis and Visualization Tool"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "RING-5 Development Team" }]
keywords = ["gem5", "data-analysis", "visualization", "performance-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "pandas==3.0.3",
  "scipy==1.18.0",
  "numpy==2.5.1",
  "matplotlib==3.11.0",
  "streamlit==1.59.2",
  "openpyxl==3.1.5",
  "plotly==6.9.0",
  "kaleido==1.3.0",
  "choreographer==1.3.0",
  "regex==2026.7.10",
  # Security floors for dependencies used by Streamlit/Matplotlib.
  "click>=8.3.3",
  "gitpython>=3.1.50",
  "pillow>=12.3.0",
  "starlette>=1.3.1",
  "tornado>=6.5.7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "black==26.5.1",
  "flake8==7.3.0",
  "flake8-pyproject==1.2.4",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest-randomly==4.1.0",
  "pytest-order==1.5.0",
  "pandas-stubs==3.0.3.260530",
  "plotly-stubs==0.1.3",
  "scipy-stubs==1.18.0.1",
  "build==1.5.1",
  "twine==6.2.0",
]
ci = [
  "bandit[toml]==1.9.4",
  "pytest-timeout==2.4.0",
  "pip-audit==2.10.1",
  # Audit-tool and packaging transitive security floors.
  "idna>=3.15",
  "msgpack>=1.2.1",
  "urllib3>=2.7.0",
]
e2e = ["pytest-playwright==0.8.0", "pytest-base-url==2.1.0", "playwright==1.61.0"]

[project.urls]
Homepage = "https://nikiitin.github.io/RING-5/"
Repository = "https://github.com/nikiitin/RING-5"

[project.scripts]
ring5 = "ring5.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ring5*"]

[tool.setuptools.package-data]
"src.parsing.gem5" = [
  "perl/*.pl",
  "perl/libs/*.pm",
  "perl/libs/Scanning/*.pm",
  "perl/libs/Scanning/Type/*.pm",
]
"src.web.components.plotting" = ["custom_plotly/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "tests/manual",
  "tests/data",
  "tests/visual",
]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers -n 3 --dist loadgroup"
xfail_strict = true
markers = [
  "public_api: Tests that enforce the supported ring5 Python API contract",
  "requires_latex: Tests that require LaTeX installation",
  "requires_browser: Tests that require a running browser/server",
  "benchmark: marks tests as performance benchmarks (deselect with '-m \"not benchmark\"')",
  "smoke: Quick smoke tests",
  "data_value: Inject data value into fixtures",
  "slow: Marks tests as slow (deselect with '-m \"not slow\"')",
  "xdist_group: Group tests to run on the same xdist worker",
  "serial: Tests that must run WITHOUT xdist parallelism (e.g. Kaleido Chromium raster export deadlocks/starves under -n 3); run them in a separate '-n 0' pass",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
  ".git",
  "__pycache__",
  "python_venv",
  ".pytest_cache",
  "*.egg-info",
  "build",
  "dist",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "pandas.*",
  "plotly.*",
  "streamlit.*",
  "matplotlib.*",
  "scipy.*",
  "numpy.*",
  "kaleido.*",
  "regex.*",
]
ignore_missing_imports = true

[tool.bandit]
# B603: subprocess without shell - we explicitly use shell=False with validated paths
# B404: import subprocess - required for Perl parser execution
skips = ["B603", "B404"]
