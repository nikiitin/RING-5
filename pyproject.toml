[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ring5"
version = "1.0.0"
description = "Modern gem5 Data Analysis and Visualization Tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "RING-5 Development Team" }]
keywords = ["gem5", "data-analysis", "visualization", "performance-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pandas>=3.0.3",
  "scipy>=1.17.1",
  "numpy>=2.4.6",
  "matplotlib>=3.10.9",
  "jsonschema>=4.26.0",
  "streamlit>=1.58.0",
  "openpyxl>=3.1.5",
  "plotly>=6.8.0",
  "kaleido>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "black>=26.5.1",
  "flake8>=7.3.0",
  "flake8-pyproject>=1.2.4",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest-randomly>=4.1.0",
  "pandas-stubs>=3.0.3.260530",
  "plotly-stubs>=0.1.3",
  "types-jsonschema>=4.26.0.20260518",
  "scipy-stubs>=1.17.1.5",
]
ci = ["bandit[toml]>=1.9.4", "pytest-timeout>=2.4.0", "pip-audit>=2.10.0"]
e2e = ["pytest-playwright>=0.8.0", "pytest-base-url>=2.1.0"]

[project.urls]
Homepage = "https://github.com/your-org/ring5"
Repository = "https://github.com/your-org/ring5"

[project.scripts]
ring5 = "ring5.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "ring5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "tests/tests_principle_compliance",
  "tests/manual",
  "tests/data",
  "tests/visual",
]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers -n 3 --dist loadgroup"
xfail_strict = true
markers = [
  "requires_latex: Tests that require LaTeX installation",
  "requires_browser: Tests that require a running browser/server",
  "benchmark: marks tests as performance benchmarks (deselect with '-m \"not benchmark\"')",
  "smoke: Quick smoke tests",
  "data_value: Inject data value into fixtures",
  "slow: Marks tests as slow (deselect with '-m \"not slow\"')",
  "xdist_group: Group tests to run on the same xdist worker",
  "serial: Tests that must run WITHOUT xdist parallelism (e.g. Kaleido Chromium raster export deadlocks/starves under -n 3); run them in a separate '-n 0' pass",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.coverage.run]
omit = [
  # WIP feature — tests are excluded via -k "not dual_axis and not dual"
  "src/web/pages/ui/plotting/types/dual_axis_bar_dot_plot.py",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
  ".git",
  "__pycache__",
  "python_venv",
  ".pytest_cache",
  "*.egg-info",
  "build",
  "dist",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
  "pandas.*",
  "plotly.*",
  "streamlit.*",
  "matplotlib.*",
  "scipy.*",
  "numpy.*",
  "yaml.*",
  "jsonschema.*",
  "kaleido.*",
]
ignore_missing_imports = true

[tool.bandit]
# B603: subprocess without shell - we explicitly use shell=False with validated paths
# B404: import subprocess - required for Perl parser execution
skips = ["B603", "B404"]
