exclude: ^tests/data/|^python_venv/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
      - id: mixed-line-ending
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: black
        name: Black formatting
        entry: python_venv/bin/black
        language: system
        types: [python]

      - id: flake8
        name: Flake8 linting
        entry: python_venv/bin/flake8
        language: system
        types: [python]

      - id: mypy
        name: MyPy type checking
        entry: python_venv/bin/mypy src ring5
        language: system
        pass_filenames: false
        files: ^(src|ring5)/.*\.py$

      - id: architecture
        name: Architecture boundaries
        entry: python_venv/bin/python scripts/check_architecture.py
        language: system
        pass_filenames: false
        files: ^(src|ring5)/.*\.py$

      - id: public-docstrings
        name: Public API documentation
        entry: python_venv/bin/python scripts/check_public_docstrings.py
        language: system
        pass_filenames: false
        files: ^(src|ring5|scripts)/.*\.py$

      - id: documentation-links
        name: Documentation links
        entry: python_venv/bin/python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: ^(README|CONTRIBUTING|AGENTS)\.md$|^docs/.*\.md$|^\.agents/.*\.md$

      - id: comments
        name: Code comment audit
        entry: python_venv/bin/python scripts/check_comments.py
        language: system
        pass_filenames: false
        files: ^(app\.py|(src|ring5|scripts|tests)/.*\.py)$

      - id: dependencies
        name: Declared production dependencies
        entry: python_venv/bin/python scripts/analyze_dependencies.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|app\.py|(src|ring5)/.*\.py)$

      - id: bandit
        name: Bandit security scan
        entry: python_venv/bin/bandit -r ring5 src -c pyproject.toml -ll
        language: system
        pass_filenames: false
        files: ^(src|ring5)/.*\.py$
