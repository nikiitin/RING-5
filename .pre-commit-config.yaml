# Pre-commit hooks for RING-5
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

# Global exclusions
exclude: ^tests/data/|^python_venv/

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-pyproject]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          [pandas-stubs, types-jsonschema, types-tqdm, types-PyYAML]
        args: [--ignore-missing-imports]
        files: ^src/

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # Basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
      - id: mixed-line-ending
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Python upgrade syntax
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py312-plus]

  # Architecture boundary enforcement (custom local hooks)
  - repo: local
    hooks:
      - id: no-streamlit-in-core
        name: No Streamlit imports in core layer
        entry: bash -c 'RESULT=$(grep -rn "import streamlit\|from streamlit" src/core/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Architecture violation - Streamlit imports in src/core/:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/core/.*\.py$
        pass_filenames: false

      - id: no-session-state-in-core
        name: No session_state in core layer
        entry: bash -c 'RESULT=$(grep -rn "session_state" src/core/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Architecture violation - session_state in src/core/:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/core/.*\.py$
        pass_filenames: false

      - id: no-inplace-true
        name: No inplace=True on DataFrames
        entry: bash -c 'RESULT=$(grep -rn "inplace=True" src/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Immutability violation - inplace=True found:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: no-bare-except
        name: No bare except clauses
        entry: bash -c 'RESULT=$(grep -rn "^[[:space:]]*except:" src/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Error handling violation - bare except found:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: no-eval-exec
        name: No eval/exec in production code
        entry: bash -c 'RESULT=$(grep -rn "eval(\|exec(" src/ --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v test); if [ -n "$RESULT" ]; then echo "Security violation - eval/exec found:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: no-models-to-services
        name: No services imports in models layer (models depend on nobody)
        entry: bash -c 'RESULT=$(grep -rn "from src.core.services\|import src.core.services" src/core/models/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Architecture violation - models importing services:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/core/models/.*\.py$
        pass_filenames: false

      - id: no-parsing-to-services
        name: No core.services imports in parsing layer (Layer A must not import Layer B)
        entry: bash -c 'RESULT=$(grep -rn "from src.core.services\|import src.core.services" src/parsing/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Architecture violation - parsing importing core.services:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/parsing/.*\.py$
        pass_filenames: false

      - id: no-web-to-state-manager
        name: No RepositoryStateManager imports in web (use the StateManager protocol via the facade)
        entry: bash -c 'RESULT=$(grep -rn "repository_state_manager" src/web/ --include="*.py" 2>/dev/null | grep -v __pycache__); if [ -n "$RESULT" ]; then echo "Architecture violation - web importing the concrete RepositoryStateManager:"; echo "$RESULT"; exit 1; fi'
        language: system
        files: ^src/web/.*\.py$
        pass_filenames: false
