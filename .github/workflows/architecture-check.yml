name: Architecture & Security Enforcement

on:
  push:
    branches: [main, develop]
    paths:
      - src/**/*.py
      - tests/**/*.py
  pull_request:
    branches: [main, develop]
    paths:
      - src/**/*.py
      - tests/**/*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-check:
    name: Architecture Boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Streamlit imports in core layer
        run: |
          echo "=== Checking layer boundary: Streamlit in src/core/ ==="
          VIOLATIONS=$(grep -rn "import streamlit\|from streamlit" src/core/ --include="*.py" 2>/dev/null | grep -v __pycache__ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Streamlit imports found in core layer (architecture violation)"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No Streamlit imports in core layer"

      - name: Check session_state access in core layer
        run: |
          echo "=== Checking layer boundary: session_state in src/core/ ==="
          # Exclude comments (lines starting with # or containing session_state only in docstrings/comments)
          VIOLATIONS=$(grep -rn "session_state" src/core/ --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v "^\s*#" | grep -v "^\s*['\"].*session_state" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::session_state access found in core layer (architecture violation)"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No session_state access in core layer"

      - name: Check inplace=True usage
        run: |
          echo "=== Checking immutability: inplace=True ==="
          VIOLATIONS=$(grep -rn "inplace=True" src/ --include="*.py" 2>/dev/null | grep -v __pycache__ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::inplace=True found (immutability violation)"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No inplace=True usage"

      - name: Check bare except clauses
        run: |
          echo "=== Checking error handling: bare except ==="
          VIOLATIONS=$(grep -rn "^[[:space:]]*except:" src/ --include="*.py" 2>/dev/null | grep -v __pycache__ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Bare except clauses found"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No bare except clauses"

      - name: Check Plotly/Matplotlib in core parsing/models
        run: |
          echo "=== Checking layer boundary: UI libs in parsing/models ==="
          VIOLATIONS=$(grep -rn "import plotly\|from plotly\|import matplotlib\|from matplotlib" src/core/parsing/ src/core/models/ --include="*.py" 2>/dev/null | grep -v __pycache__ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::UI library imports found in parsing/models layer"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No UI library imports in parsing/models"

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit[toml] pip-audit

      - name: Check for dangerous patterns
        run: |
          echo "=== Checking for dangerous code patterns ==="
          ISSUES=0

          # eval/exec
          RESULT=$(grep -rn "eval(\|exec(" src/ --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v test || true)
          if [ -n "$RESULT" ]; then
            echo "::warning::eval()/exec() found in production code:"
            echo "$RESULT"
            ISSUES=$((ISSUES+1))
          fi

          # pickle.load on untrusted data
          RESULT=$(grep -rn "pickle\.load\|pickle\.loads" src/ --include="*.py" 2>/dev/null | grep -v __pycache__ || true)
          if [ -n "$RESULT" ]; then
            echo "::warning::pickle.load() found (potential deserialization vulnerability):"
            echo "$RESULT"
            ISSUES=$((ISSUES+1))
          fi

          # Hardcoded secrets
          RESULT=$(grep -rn "password\s*=\s*['\"].\+['\"]" src/ --include="*.py" 2>/dev/null | grep -v __pycache__ | grep -v test || true)
          if [ -n "$RESULT" ]; then
            echo "::error::Potential hardcoded secrets found:"
            echo "$RESULT"
            ISSUES=$((ISSUES+1))
          fi

          if [ $ISSUES -gt 0 ]; then
            echo "⚠️ $ISSUES security pattern(s) found — review required"
          else
            echo "✅ No dangerous patterns detected"
          fi

      - name: Run Bandit security scanner
        run: |
          bandit -r src/ -c pyproject.toml -ll --format json --output bandit-report.json || true
          bandit -r src/ -c pyproject.toml -ll --format txt || true

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          pip-audit --format columns || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore
