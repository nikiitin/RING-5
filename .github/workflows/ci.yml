name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, security, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci]"

      - name: Run quality gate
        run: make quality-gate

      - name: Validate distributions
        run: make package-check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci]"

      - name: Prepare test fixtures
        run: make test-data mock-data

      - name: Run non-browser tests
        if: matrix.python-version != '3.12'
        run: >-
          python_venv/bin/pytest -m "not requires_browser and not serial"
          --timeout=60 --no-cov

      - name: Run coverage gate
        if: matrix.python-version == '3.12'
        run: >-
          python_venv/bin/pytest -m "not requires_browser and not serial"
          --timeout=60 --cov=src --cov=ring5 --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=84

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  exports:
    name: Figure exports (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci]"

      - name: Install Chrome for Kaleido
        run: python_venv/bin/kaleido_get_chrome

      - name: Run serial export tests
        run: >-
          python_venv/bin/pytest -m "not requires_browser and serial"
          -n 0 --timeout=120 --no-cov

  e2e:
    name: Streamlit E2E
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci,e2e]"

      - name: Install Chromium
        run: python_venv/bin/playwright install --with-deps chromium

      - name: Prepare test fixtures
        run: make test-data mock-data

      - name: Run E2E tests
        run: make test-e2e
