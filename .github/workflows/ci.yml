name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and audit documentation
        run: |
          python -m venv python_venv
          make docs-build docs-audit

  oft:
    name: OpenFastTrace HTML report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install application
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e .

      - name: Generate and verify OFT report
        run: make oft-report

      - name: Upload OFT HTML report
        uses: actions/upload-artifact@v7
        with:
          name: ring5-openfasttrace-report
          path: spec/oft/generated/report.html
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Quality, security, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci]"

      - name: Run quality gate
        run: make quality-gate

      - name: Validate distributions
        run: make package-check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          # The coverage gate collects the full test tree before marker filtering,
          # so its environment must be able to import the E2E conftest module.
          python_venv/bin/pip install -e ".[dev,ci,e2e]"

      - name: Prepare test fixtures
        run: make test-data mock-data

      - name: Run non-browser tests
        if: matrix.python-version != '3.12'
        run: make test-nonbrowser

      - name: Run coverage gate
        if: matrix.python-version == '3.12'
        run: make test-ci

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  exports:
    name: Figure exports (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci]"

      - name: Install Chrome for Kaleido
        run: python_venv/bin/kaleido_get_chrome

      - name: Run serial export tests
        run: make test-export

  latex:
    name: LaTeX figure exports
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-xetex cm-super

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci]"

      - name: Run LaTeX export tests
        run: make test-latex

  e2e:
    name: Streamlit E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m venv python_venv
          python_venv/bin/python -m pip install "pip==26.1.2"
          python_venv/bin/pip install -e ".[dev,ci,e2e]"

      - name: Install Chromium
        run: python_venv/bin/playwright install --with-deps chromium

      - name: Prepare test fixtures
        run: make test-data mock-data

      - name: Run E2E tests
        run: make test-e2e
