name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build and audit documentation
        run: |
          python -m venv python_venv
          make docs-build docs-audit docs-security

  oft:
    name: OpenFastTrace HTML report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install application
        run: make sync-dev

      - name: Generate and verify OFT report
        run: make oft-report

      - name: Upload OFT HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ring5-openfasttrace-report
          path: spec/oft/generated/report.html
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Quality, security, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install exact dependencies
        run: make sync-dev

      - name: Run quality gate
        run: make quality-gate

      - name: Validate distributions
        run: make package-check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install exact dependencies
        run: make sync-dev

      - name: Prepare test fixtures
        run: make test-data mock-data

      - name: Run non-browser tests
        if: matrix.python-version != '3.12'
        run: make test-nonbrowser

      - name: Run coverage gate
        if: matrix.python-version == '3.12'
        run: make test-ci

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  exports:
    name: Figure exports (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install exact dependencies
        run: make sync-dev

      - name: Install Chrome for Kaleido
        run: |
          browser_path="$(python_venv/bin/python -m ring5.cli install-chrome)"
          printf 'BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Run serial export tests
        run: make test-export

  latex:
    name: LaTeX figure exports
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install LaTeX
        run: make install-latex check-latex

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install exact dependencies
        run: make sync-dev

      - name: Run LaTeX export tests
        run: make test-latex

  wheel-smoke:
    name: Installed wheel (Linux)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Build and install wheel
        run: |
          uv build --wheel
          uv venv --python 3.12 "$RUNNER_TEMP/ring5-wheel"
          uv pip install --python "$RUNNER_TEMP/ring5-wheel/bin/python" dist/*.whl "pytest==9.1.1"
      - name: Exercise installed public API outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ring5-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installation.py"
      - name: Verify native process lock exclusion
        run: |
          cd "$RUNNER_TEMP"
          touch pytest-wheel.ini
          "$RUNNER_TEMP/ring5-wheel/bin/python" -m pytest \
            --noconftest --import-mode=importlib -c pytest-wheel.ini \
            "$GITHUB_WORKSPACE/tests/unit/test_file_lock.py" \
            -k "lock_excludes_other_process or lock_failed_acquisition" -q

  e2e:
    name: Streamlit E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install exact dependencies
        run: make sync-dev

      - name: Install Chromium
        run: python_venv/bin/playwright install --with-deps chromium

      - name: Install figure-export dependencies
        run: |
          make install-latex check-latex
          browser_path="$(python_venv/bin/python -m ring5.cli install-chrome)"
          printf 'BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Prepare test fixtures
        run: make test-data mock-data

      - name: Run complete browser acceptance
        run: make test-e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: |
            tests/e2e/artifacts/
            tests/visual/artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
