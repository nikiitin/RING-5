name: Dependency automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number; leave empty to inspect open updates
        required: false
        type: string
        default: ""
      dry_run:
        description: Inspect eligibility without requesting reviews, commenting, or merging
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dependency-automation
  cancel-in-progress: false

jobs:
  review-and-merge:
    name: Review dependency updates
    if: vars.DEPENDENCY_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Assess dependency pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_AUTOMATION_REVIEWER: ${{ vars.DEPENDENCY_AUTOMATION_REVIEWER }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--config .github/dependency-automation.json)
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$DRY_RUN" == "false" ]]; then
            args+=(--apply)
          fi
          python -m scripts.dependency_automation "${args[@]}"
