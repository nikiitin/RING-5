# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# The plugin catalog currently stops at Python 3.14.4. Use the maintained
# standalone build for this runtime until the catalog includes this release.
downloads:
  - name: python
    downloads:
      - version: 3.14.9
        os:
          linux: unknown-linux-gnu
        cpu:
          x86_64: x86_64
          arm_64: aarch64
        url: https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-${version}+20261021-${cpu}-${os}-install_only_stripped.tar.gz
        strip_components: 1
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.27.3
    - node@24.22.1
    - python@3.14.9
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    - linters: [markdownlint, prettier]
      paths:
        - "**/*.md" # Markdown linting available via --filter but excluded from default checks
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.30
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.10
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.4
    - yamllint@1.38.0
actions:
  disabled:
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
