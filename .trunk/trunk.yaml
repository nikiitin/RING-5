# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    - linters: [bandit]
      paths:
        - tests/**
        - scripts/verify_installation.py # Installation checker uses subprocess for system validation
        - src/parsing/gem5/impl/scanning/scanner.py # Subprocess used for Perl parser - validated paths only
        - src/parsing/gem5/impl/strategies/perl_worker_pool.py # Subprocess used for Perl parser - validated paths only
    - linters: [mypy]
      paths:
        - tests/** # mypy runs on tests via project's own mypy with full module resolution
  definitions:
    - name: mypy
      run_linter_from: workspace
      commands:
        - name: lint
          output: mypy
          run: mypy --config-file=pyproject.toml --explicit-package-bases
            --follow-imports=normal --no-incremental --show-error-codes
            --show-column-numbers ${target}
          success_codes: [0, 1]
  enabled:
    - oxipng@10.1.0
    - pyright@1.1.408
    - flake8@7.3.0
    - mypy@1.19.1
    - black@26.1.0:
        extra_args: [--config=pyproject.toml]
    - hadolint@2.14.0
    - actionlint@1.7.11
    - isort@8.0.0
    - bandit@1.9.4:
        extra_args: [-c, pyproject.toml]
    - checkov@3.2.506
    - git-diff-check
    - markdownlint@0.47.0
    - prettier@3.8.1
    - ruff@0.15.3
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - trufflehog@3.93.5
    - yamllint@1.38.0
actions:
  disabled:
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
